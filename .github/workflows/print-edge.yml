name: Print layout in Microsoft Edge
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: |
          command -v microsoft-edge || npx playwright install msedge
          command -v pdfinfo || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          node .github/verify-edge.cjs
